name: "CodeQL Advanced"

# Job names, step names, and matrix shape follow GitHub's canonical
# "CodeQL Advanced" Code Scanning template exactly. The Code Scanning UI
# registers configurations keyed off `(workflow_path, job_id, category)`
# tuples and shows status using template-default identifiers; deviating
# from those names produces orphan configuration cards in the UI that
# can't be cleaned up via API (PR-merge analyses are non-deletable).
#
# Three matrix entries cover the languages CodeQL detects in this repo:
#   - actions             (source-only)
#   - java-kotlin         (manual build via codeqlCompileJvm — see note below)
#   - javascript-typescript (source-only)
#
# For java-kotlin, the matrix-shared `Initialize CodeQL -> Perform CodeQL
# Analysis` flow is augmented with two conditional steps that run ONLY
# for that language:
#
#   1. JDK + Gradle setup (the other two languages need no toolchain).
#   2. A direct `./gradlew codeqlCompileJvm` invocation under CodeQL init.
#
# `codeqlCompileJvm` is a JavaExec task in build.gradle.kts that runs
# kotlin-compiler-embeddable 2.3.20 against commonMain as a single-target
# compile (no -Xfragments). The K2 phased pipeline that bypasses
# K2JVMCompiler.doExecute -- which the CodeQL Java agent hooks for Kotlin
# extraction -- is only engaged for multiplatform-fragment compiles, so a
# single-target invocation still dispatches through doExecute and the agent's
# class-load hook fires. Using autobuild here (the template's default for
# java-kotlin) would route through KGP's multiplatform compileKotlinJvm and
# produce 0 bytes of Kotlin TRAP. That's why this file uses `build-mode:
# manual` for java-kotlin even though autobuild is the template default.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for SARIF upload
      security-events: write
      # required by codeql-action/analyze@v4 in private repos
      actions: read
      # required to fetch internal or private CodeQL packs from GHCR
      packages: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # JDK + Gradle setup only for java-kotlin; the source-only languages
      # don't run any build at all.
      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6.1.0

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Restores+stores the CodeQL bundle and dependency cache between
          # runs. Default off in Advanced Setup; turning on cuts ~30-60s
          # off the init step on warm cache.
          dependency-caching: true

      # Manual build: only java-kotlin gates this. Initialize CodeQL above
      # exports the tracer environment; stopping the daemon ensures Gradle's
      # JavaExec child process is launched from that environment.
      - name: Stop pre-existing Gradle daemon
        if: matrix.build-mode == 'manual'
        run: ./gradlew --stop || true

      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        run: ./gradlew --no-daemon codeqlCompileJvm --no-configuration-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
